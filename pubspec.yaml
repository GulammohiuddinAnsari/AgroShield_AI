name: agroshield_ai
description: "A new Flutter project for offline crop disease diagnosis and farm management."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.3
  tflite_flutter: ^0.12.1
  sqflite: ^2.4.4
  path: ^1.9.1
  image: ^4.1.7
  share_plus: ^10.1.2
  http: ^1.2.0
  flutter_blue_plus: ^1.35.4
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/offline_crop_model.tflite
    - assets/labels.txt

# Root-level configuration for app icons (must not be indented under flutter:)
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: true
  image_path_android: "assets/icon/app_icon.png"
  image_path_ios: "assets/icon/app_icon.png"